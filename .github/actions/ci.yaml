name: Build & Push Docker Image to GHCR

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*.*"         # Trigger juga saat push tag versi, misal: v1.0.0
  pull_request:
    branches:
      - main
      - master           # Build saja (tanpa push) saat ada PR

env:
  REGISTRY: ghcr.io
  # Format: ghcr.io/<username>/<repo-name>
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest

    # Izin yang dibutuhkan untuk push ke GHCR
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Checkout kode
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Docker Buildx (untuk multi-platform & cache)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login ke GitHub Container Registry
      #    Menggunakan GITHUB_TOKEN bawaan — tidak perlu secret tambahan
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 4. Ekstrak metadata (tags & labels) otomatis dari konteks Git
      #    - Branch main/master  → tag "latest"
      #    - Push tag v1.2.3     → tag "1.2.3", "1.2", "1"
      #    - Pull request        → tag "pr-<nomor>"
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      # 5. Build image dan push ke GHCR
      #    Cache layer disimpan di GitHub Actions Cache agar build lebih cepat
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Uncomment untuk build multi-platform:
          # platforms: linux/amd64,linux/arm64

      # 6. (Opsional) Tampilkan image digest untuk verifikasi
      - name: Print image digest
        if: github.event_name != 'pull_request'
        run: echo "Image digest → ${{ steps.build-and-push.outputs.digest }}"